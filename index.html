<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Code Finder — Components</title>

  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="brand">
        <div class="logo">CF</div>
        <div>
          <h1 class="site-title">Code Finder</h1>
          <div class="tagline">Search small UI components (HTML, JS, JSX) and copy snippets</div>
        </div>
      </div>

      <div class="search-area">
        <div class="search-card">
          <input id="searchInput" class="search-input" type="search" placeholder='Try "navigation bar"' />
          <button id="searchBtn" class="btn primary">Find</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="result-wrapper">
        <div id="resultCard" class="card hidden">
          <div class="card-head">
            <div>
              <h2 id="exampleTitle" class="example-title"></h2>
              <p id="exampleDesc" class="example-desc"></p>
            </div>
            <div class="tag">Example</div>
          </div>

          <div class="snippets">
            <div class="snippet-block">
              <div class="snippet-header">
                <strong>HTML</strong>
                <button class="btn small outline copy-btn" data-target="htmlCode">Copy</button>
              </div>
              <pre><code id="htmlCode" class="code-block"></code></pre>
            </div>

            <div class="snippet-block">
              <div class="snippet-header">
                <strong>JavaScript</strong>
                <button class="btn small outline copy-btn" data-target="jsCode">Copy</button>
              </div>
              <pre><code id="jsCode" class="code-block"></code></pre>
            </div>

            <div class="snippet-block">
              <div class="snippet-header">
                <strong>JSX (React)</strong>
                <button class="btn small outline copy-btn" data-target="jsxCode">Copy</button>
              </div>
              <pre><code id="jsxCode" class="code-block"></code></pre>
            </div>
          </div>

          <div id="statusMessage" class="status hidden">Copied ✓</div>
        </div>

        <div id="noResult" class="card muted hidden">
          No examples found for that query. Try "navigation", "nav", or "navigation bar".
        </div>
      </section>
    </main>

    <footer class="footer">
      © <span id="year"></span> — Code Finder
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
